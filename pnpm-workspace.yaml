# Keep every Effect package on one exact version: a mixed 4.0 and 4.1 install fails at runtime.
overrides:
  effect: 4.0.7
  "@effect/platform-node-shared": 4.0.7
  "@effect/platform-node": 4.0.7
  "@effect/sql-sqlite-node": 4.0.7
  "@effect/vitest": 4.0.7
# Install scripts we do not need (Pi's Google provider). Nothing else runs install scripts.
allowBuilds:
  "@google/genai": false
  protobufjs: false
# pnpm holds back packages published in the last day. These are pinned on purpose: Pi 1.5.0 is the version
# the router proof tested, and vitest 5.1.0 is what @effect/vitest 4.0.7 needs.
minimumReleaseAgeExclude:
  - "@earendil-works/chord@1.5.0"
  - "@earendil-works/pi-ai@1.5.0"
  - "@earendil-works/pi-codemode@1.5.0"
  - "@earendil-works/pi-durable@1.5.0"
  - "@earendil-works/pi-schema@1.5.0"
  - "@earendil-works/pi-telemetry@1.5.0"
  - "@vitest/mocker@5.1.0"
  - "@vitest/spy@5.1.0"
  - vitest@5.1.0
